name: Validate community catalog and SDK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema:
    name: Schema and catalog policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry schema
        run: >-
          npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1
          ajv validate --spec=draft2020 --strict=false -c ajv-formats
          -s schema/registry.schema.json -d registry.json
      - name: Validate template manifest schema
        run: >-
          npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1
          ajv validate --spec=draft2020 --strict=false -c ajv-formats
          -s schema/plugin.schema.json -d templates/hello-world/plugin.json
      - name: Validate catalog invariants
        shell: pwsh
        run: ./tools/validate-registry.ps1
      - name: Audit public SDK source boundary
        shell: pwsh
        run: ./tools/validate-sdk-boundary.ps1
      - name: Test package path safety
        shell: pwsh
        run: ./tools/test-package-validator.ps1
      - name: Test community custody policy
        shell: pwsh
        run: ./tools/test-community-custody.ps1

      - name: Test catalog publication safeguards
        shell: pwsh
        run: ./tools/test-catalog-publication.ps1
      - name: Test package security scan pipeline
        shell: pwsh
        run: ./tools/test-security-pipeline.ps1
      - name: Test source rebuild contract
        shell: pwsh
        run: ./tools/test-source-build.ps1
      - name: Install bubblewrap for the rebuild sandbox tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test source rebuild hardening and sandbox
        shell: pwsh
        run: ./tools/test-rebuild-hardening.ps1

  build:
    name: SDK and template build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-x64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build standalone SDK and template
        run: dotnet build Zeus.CommunityFeatures.slnx -c Release --nologo
      - name: Package Hello World
        shell: pwsh
        run: ./templates/hello-world/build-package.ps1
      - name: Validate Hello World package
        shell: pwsh
        run: >-
          ./tools/validate-package.ps1
          -PackagePath artifacts/com.example.zeus.helloworld/com.example.zeus.helloworld-1.0.0.zip
          -ExpectedId com.example.zeus.helloworld
          -ExpectedVersion 1.0.0
          -ExpectedSdkAbi 1
          -ExpectedSdkMinVersion 1.5.0

  packages:
    name: HTTPS, checksum, and embedded manifests
    needs: schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate every immutable package
        shell: pwsh
        run: ./tools/validate-registry.ps1 -DownloadPackages

  publish:
    name: Publish download-host catalog
    needs: [schema, build, packages]
    if: >-
      github.repository == 'Zeus-SDR/zeus-community-features' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: community-catalog-publication
      cancel-in-progress: false
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned upload client
        run: npm install --prefix "$RUNNER_TEMP/catalog-publisher" --no-audit --no-fund --ignore-scripts wrangler@4.103.0
      - name: Publish current main catalog
        id: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(gh api repos/Zeus-SDR/zeus-community-features/git/ref/heads/main --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded commit $GITHUB_SHA; main is $current_sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          "$RUNNER_TEMP/catalog-publisher/node_modules/.bin/wrangler" r2 object put \
            zeussdr-downloads/plugins/registry.json --remote --file registry.json \
            --content-type application/json --cache-control 'public, max-age=60'
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify the public catalog content
        if: steps.upload.outputs.published == 'true'
        shell: pwsh
        run: |
          ./tools/verify-published-catalog.ps1
          "Published and verified registry.json from commit $env:GITHUB_SHA at https://downloads.zeussdr.com/plugins/registry.json" >> $env:GITHUB_STEP_SUMMARY
